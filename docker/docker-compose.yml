services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=banking_db
      - POSTGRES_USER={{ postgres_user }}
      - POSTGRES_PASSWORD={{ postgres_password }}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
    - 5432:5432
  
  backend:
    build: ../backend
    depends_on:
      - db
    environment:
      - DB_NAME=banking_db
      - DB_USER={{ postgres_user }}
      - DB_PASSWORD={{ postgres_password }}
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - 8000:8000
    volumes:
      - ../backend:/app
    
  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - 5173:5173
    volumes:
      - ../frontend:/app
      - /app/node_modules
    

volumes:
  pgdata: